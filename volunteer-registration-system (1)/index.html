<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Volunteer Registration System</h1>
        <div id="user-info" class="hidden">
            <span id="welcome-msg"></span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </header>

    <main>
        <!-- LOGIN SECTION -->
        <section id="login-section">
            <div class="card login-card">
                <h2>Login to Dashboard</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">Name:</label>
                        <input type="text" id="username" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="role">Role:</label>
                        <select id="role">
                            <option value="volunteer">Volunteer</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
        </section>

        <!-- ADMIN DASHBOARD -->
        <section id="admin-section" class="hidden">
            <h2>Admin Dashboard</h2>
            
            <div class="dashboard-grid">
                <!-- Manage Events -->
                <div class="card">
                    <h3>Create New Event</h3>
                    <form id="event-form" onsubmit="handleCreateEvent(event)">
                        <div class="form-group">
                            <label>Event Title:</label>
                            <input type="text" id="event-title" required>
                        </div>
                        <div class="form-group">
                            <label>Date:</label>
                            <input type="date" id="event-date" required>
                        </div>
                        <div class="form-group">
                            <label>Description:</label>
                            <textarea id="event-desc" required></textarea>
                        </div>
                        <button type="submit" class="btn">Add Event</button>
                    </form>
                </div>

                <div class="card">
                    <h3>All Events (CRUD)</h3>
                    <div id="admin-events-list"></div>
                </div>
            </div>

            <!-- Manage Applications -->
            <div class="card mt-2">
                <h3>Volunteer Registrations Workflow</h3>
                <div id="admin-applications-list"></div>
            </div>
        </section>

        <!-- VOLUNTEER DASHBOARD -->
        <section id="volunteer-section" class="hidden">
            <h2>Volunteer Dashboard</h2>
            
            <div class="dashboard-grid">
                <!-- Available Events -->
                <div class="card">
                    <h3>Available Events</h3>
                    <div class="search-bar">
                        <input type="text" id="search-events" placeholder="Search events..." onkeyup="filterEvents()">
                    </div>
                    <div id="volunteer-events-list"></div>
                </div>

                <!-- My Status Tracking -->
                <div class="card">
                    <h3>My Registrations & Status</h3>
                    <div id="volunteer-applications-list"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
